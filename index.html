<!DOCTYPE html>

<html>

<head>
  <meta charset="UTF-8">
  <title>music share</title>
  
  <style>
    body {
      font-family: monospace;
    }
    
    #tracks {
      padding: 0;
    }
    
    #content {
      margin-top: 10px;
    }
    
    figure {
      margin: 0;
      border-top: 1px solid #ccc;
    }
    
    li {
      padding: 20px 0px 20px 0px;
    }
    
    figure > p {
      margin: 0;
    }
  </style>
</head>

<body>
  <h1> music share </h1>
  <p> sharing some of my arrangements here :). if there are any issues, please feel free to contact me via issue on my GitHub repo page (<a href='https://github.com/syncopika/music_share/issues'>link</a>). thank you! </p>
  <!-- <label for="searchBox">search:</label> -->
  <input id='searchBox' type='text' />
  <button id="searchBtn"> search </button>
  
  <!-- icons from iconoir.com -->
  <button id='listFormat' title='list format' aria-label='show in list format'> <?xml version="1.0" encoding="UTF-8"?><svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M8 6L20 6" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 6.01L4.01 5.99889" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 12.01L4.01 11.9989" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 18.01L4.01 17.9989" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 12L20 12" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 18L20 18" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <button id='tileFormat' title='tile format' aria-label='show in tile format'> <?xml version="1.0" encoding="UTF-8"?><svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M21 3.6V20.4C21 20.7314 20.7314 21 20.4 21H3.6C3.26863 21 3 20.7314 3 20.4V3.6C3 3.26863 3.26863 3 3.6 3H20.4C20.7314 3 21 3.26863 21 3.6Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg> </button>
  
  <div id='content'>
    <!-- music tracks go here -->      
    <ul id='tracks'>
    </ul>
  </div>
</body>

<script>
function debounce(){
  // TODO? - would need to get rid of search button though if we implement this
}

function search(string){
  // clear the list first
  const list = document.getElementById('tracks');
  while(list.children.length > 0){
    list.removeChild(list.firstChild);
  }
  console.log('cleared list!');
  const container = document.getElementById('tracks');
  tracks.forEach(track => {
    if(track.trackname.toLowerCase().includes(string) || 
      track.tags.map(t => t.toLowerCase()).includes(string) || 
      track.info.toLowerCase().includes(string)
    ){
      const newTrack = makeTrackElement(track);
      container.appendChild(newTrack);
    }
  });
}

function turnOtherTracksOff(thisTrackName){
  return () => {
    // get all audio elements
    const audioElements = document.querySelectorAll('audio');
    
    // pause all audio elements that aren't this track
    audioElements.forEach(el => {
      if(el.id !== thisTrackName){
        el.pause();
      }
    });
  }
}

// create li element containing track info + audio
function makeTrackElement(trackInfo, isListElement=true){
  /*
  <li>
    <figure>
      <img src="https://drive.google.com/thumbnail?id=1nTbdEfsQrOBHvY4z6_OMabZ0z9rX5xG1" />
      <figcaption> ninkoro dance orchestral arrangement </figcaption>
      <audio controls src="music/062525ninkoroEDarr.ogg"></audio>
      <p class="tags">tags</p>
    </figure>
  </li>
  */
  const li = isListElement ? document.createElement('li') : document.createElement('div');
  const img = document.createElement('img');
  img.src = trackInfo.image;
  
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.src = `music/${trackInfo.filename}.mp3`;
  audio.id = trackInfo.filename;
  
  // when we play a track, we'll pause any other track that's currently playing
  audio.addEventListener('play', turnOtherTracksOff(trackInfo.filename));
  
  const figure = document.createElement('figure');
  const figCaption = document.createElement('figcaption');
  figCaption.textContent = trackInfo.trackname;
  figCaption.style.fontWeight = 'bold';
  
  const info = document.createElement('p');
  info.textContent = trackInfo.info;
  
  const tags = document.createElement('p');
  if(trackInfo.tags && trackInfo.tags.length > 0){
    tags.textContent = `tags: ${trackInfo.tags.join(',')}`;
  }
  
  figure.appendChild(img);
  figure.appendChild(figCaption);
  figure.appendChild(audio);
  figure.appendChild(info);
  figure.appendChild(tags);
  li.appendChild(figure);
  
  return li;
}

document.getElementById('searchBtn').addEventListener('click', () => {
  const searchStr = document.getElementById('searchBox').value;
  search(searchStr.toLowerCase());
});

function showTracksInListFormat(){
  const container = document.getElementById('content');
  container.replaceChildren(); // clear children
  
  const list = document.createElement('ul');
  list.id = 'tracks';
  
  // can query a specific track via 'search' parameter
  const urlParams = new URL(document.location.toString()).searchParams;
  const queryParamValue = urlParams.get('search')?.toLowerCase();
  
  tracks.forEach(track => {
    if(!queryParamValue){
      const newTrack = makeTrackElement(track);
      list.appendChild(newTrack);
    }else{
      console.log(`searching for ${queryParamValue}`);
      if(track.trackname.toLowerCase().includes(queryParamValue) || track.tags.includes(queryParamValue)){
        const newTrack = makeTrackElement(track);
        list.appendChild(newTrack);
      }
    }
  });
  
  container.appendChild(list);
}

document.getElementById('listFormat').addEventListener('click', () => showTracksInListFormat());

function showTracksInTileFormat(){
  const container = document.getElementById('content');
  container.replaceChildren(); // clear children
  
  const tileContainer = document.createElement('div');
  tileContainer.id = 'tracks';
  tileContainer.style.display = 'flex';
  tileContainer.style.flexWrap = 'wrap';
  tileContainer.style.gap = '20px';
  
  // can query a specific track via 'search' parameter
  const urlParams = new URL(document.location.toString()).searchParams;
  const queryParamValue = urlParams.get('search')?.toLowerCase();
  
  tracks.forEach(track => {
    if(!queryParamValue){
      const newTrack = makeTrackElement(track, false);
      newTrack.style.border = '1px solid #ccc';
      newTrack.style.padding = '5px';
      tileContainer.appendChild(newTrack);
    }else{
      console.log(`searching for ${queryParamValue}`);
      if(track.trackname.toLowerCase().includes(queryParamValue) || track.tags.includes(queryParamValue)){
        const newTrack = makeTrackElement(track, false);
        newTrack.style.border = '1px solid #ccc';
        newTrack.style.padding = '5px';
        tileContainer.appendChild(newTrack);
      }
    }
  });
  
  container.appendChild(tileContainer);
}

document.getElementById('tileFormat').addEventListener('click', () => showTracksInTileFormat());

let tracks = [];

async function getAndListTracks(){
  // try using this https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams
  // see if url has a track specified and if so, just look for that one
  // also helpful: https://stackoverflow.com/questions/9870512/how-to-obtain-the-query-string-from-the-current-url-with-javascript
  tracks = [];

  // fetch json containing track info for each track
  const trackDataJson = await fetch('metadata.json');
  const trackData = await trackDataJson.json();
  
  const container = document.getElementById('content');
  container.replaceChildren(); // clear children
  
  const list = document.createElement('ul');
  list.id = 'tracks';
  
  // can query a specific track via 'search' parameter
  const urlParams = new URL(document.location.toString()).searchParams;
  const queryParamValue = urlParams.get('search')?.toLowerCase();
  
  // sort
  trackData.sort((t1, t2) => t2.trackname.trim().toLowerCase().localeCompare(t1.trackname.trim().toLowerCase()));
  
  trackData.forEach(track => {
    if(track.filename){
      if(!queryParamValue){
        const newTrack = makeTrackElement(track);
        list.appendChild(newTrack);
      }else{
        console.log(`searching for ${queryParamValue}`);
        if(track.trackname.toLowerCase().includes(queryParamValue) || track.tags.includes(queryParamValue)){
          const newTrack = makeTrackElement(track);
          list.appendChild(newTrack);
        }
      }
      tracks.push(track);
    }
  });
  
  container.appendChild(list);
}

getAndListTracks();

</script>

</html>
